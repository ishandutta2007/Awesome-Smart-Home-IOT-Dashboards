<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1933"/>
      <stop offset="100%" stop-color="#080c17"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <style>
      .title-text {
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .mono-text {
        font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace;
      }

      /* Dynamic Wave / Flow Animation */
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-8px) scale(1.02); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4px; fill-opacity: 0.6; }
        50% { r: 6.5px; fill-opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      @keyframes pillFloat1 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pillFloat2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(6px); }
      }

      .pulse-node { animation: nodePulse 3s infinite ease-in-out; }
      .radar-line { transform-origin: 1060px 100px; animation: radarSweep 10s linear infinite; }
      .data-stream { stroke-dasharray: 8 6; animation: dashAnim 4s linear infinite; }
      .card-float1 { animation: pillFloat1 6s ease-in-out infinite; }
      .card-float2 { animation: pillFloat2 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Ambient Ambient Decorative Orbs (Strictly Background) -->
  <circle cx="150" cy="80" r="140" fill="#00f2fe" opacity="0.07" filter="url(#glow)"/>
  <circle cx="1050" cy="320" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="950" cy="90" r="110" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>

  <!-- Dynamic IoT Constellation & Circuit Traces (Background Layer) -->
  <g opacity="0.55">
    <path class="data-stream" d="M 60 360 C 240 330, 320 390, 500 370 C 700 350, 850 400, 1140 350" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <path class="data-stream" d="M 120 70 C 350 110, 550 50, 750 90 C 920 120, 1050 60, 1140 80" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dashoffset="50"/>

    <!-- Dynamic Pulsing Sensor Nodes -->
    <circle cx="240" cy="345" r="5" fill="#00f2fe" class="pulse-node" style="animation-delay: 0s;"/>
    <circle cx="500" cy="370" r="5" fill="#38bdf8" class="pulse-node" style="animation-delay: 1s;"/>
    <circle cx="750" cy="90" r="5" fill="#a855f7" class="pulse-node" style="animation-delay: 1.5s;"/>
    <circle cx="920" cy="115" r="5" fill="#00f2fe" class="pulse-node" style="animation-delay: 2s;"/>
  </g>

  <!-- Ambient Radar & Live Telemetry Graphics (Right Side Background) -->
  <g transform="translate(0, 0)">
    <!-- Simulated Radar Scanner -->
    <circle cx="1060" cy="110" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="1060" cy="110" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="1060" cy="110" r="20" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="1060" y1="40" x2="1060" y2="180" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2"/>
    <line x1="990" y1="110" x2="1130" y2="110" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2"/>
    <line class="radar-line" x1="1060" y1="110" x2="1110" y2="60" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Subtle Floating Dashboard Metric Mini-Card 1 -->
    <g class="card-float1" transform="translate(930, 220)" filter="url(#shadow)">
      <rect width="210" height="68" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="24" cy="24" r="10" fill="#00f2fe" fill-opacity="0.15"/>
      <path d="M 20 24 L 23 27 L 29 21" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="22" fill="#94a3b8" font-size="11" class="subtitle-text">MQTT TELEMETRY</text>
      <text x="42" y="38" fill="#38bdf8" font-size="14" font-weight="700" class="mono-text">ONLINE · 240 ms</text>
      <!-- Mini Sparkline Graph -->
      <path d="M 22 55 Q 50 48, 80 52 T 130 46 T 170 53 T 195 48" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Subtle Floating Dashboard Metric Mini-Card 2 -->
    <g class="card-float2" transform="translate(970, 305)" filter="url(#shadow)">
      <rect width="185" height="60" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="24" cy="24" r="10" fill="#a855f7" fill-opacity="0.2"/>
      <text x="24" y="28" fill="#c084fc" font-size="12" text-anchor="middle">⚡</text>
      <text x="44" y="22" fill="#94a3b8" font-size="10" class="subtitle-text">ACTIVE NODES</text>
      <text x="44" y="38" fill="#e2e8f0" font-size="13" font-weight="700" class="mono-text">42 Connected</text>
      <!-- Pulse Bar -->
      <rect x="44" y="45" width="120" height="4" rx="2" fill="#334155"/>
      <rect x="44" y="45" width="95" height="4" rx="2" fill="#a855f7"/>
    </g>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Guaranteed Unobscured & High Contrast) -->
  <g transform="translate(70, 0)">
    
    <!-- Top Decorative Status Pill -->
    <g transform="translate(0, 60)">
      <rect width="250" height="30" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="19.5" fill="#38bdf8" font-size="11.5" font-weight="600" class="mono-text">LOCAL-FIRST · MQTT · MATTER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="44" fill="#ffffff" filter="url(#shadow)">
      Smart Home &amp; IoT Dashboards
    </text>

    <!-- Subtitle Gradient Accent -->
    <text x="0" y="185" class="title-text" font-size="22" font-weight="600" fill="url(#primaryGlow)">
      Awesome Open-Source Hubs, Kiosk Panels &amp; Cloud IoT Platforms
    </text>

    <!-- Comprehensive Explanatory Tagline -->
    <text x="0" y="222" class="subtitle-text" font-size="15" fill="#94a3b8">
      Curated telemetry stacks, touch-wall Lovelace tablets, Node-RED flows, Zigbee/Z-Wave bridges,
    </text>
    <text x="0" y="246" class="subtitle-text" font-size="15" fill="#94a3b8">
      and industrial edge-to-cloud observability engines for makers and enterprise builders.
    </text>

    <!-- Feature Tags / Tech Stack Badges in Foreground -->
    <g transform="translate(0, 280)">
      <!-- Pill 1: Home Assistant -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="72" y="21.5" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">🏠 Home Assistant</text>
      </g>

      <!-- Pill 2: ThingsBoard -->
      <g transform="translate(155, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="65" y="21.5" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">📊 ThingsBoard</text>
      </g>

      <!-- Pill 3: Node-RED -->
      <g transform="translate(295, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="57" y="21.5" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">🔴 Node-RED</text>
      </g>

      <!-- Pill 4: Grafana -->
      <g transform="translate(420, 0)">
        <rect width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="52" y="21.5" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">📈 Grafana</text>
      </g>

      <!-- Pill 5: ESPHome / Zigbee -->
      <g transform="translate(535, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="72" y="21.5" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">⚡ ESPHome &amp; MQTT</text>
      </g>
    </g>

    <!-- Bottom Metadata Details -->
    <g transform="translate(0, 350)">
      <circle cx="6" cy="6" r="3" fill="#00f2fe"/>
      <text x="18" y="10" fill="#64748b" font-size="12" class="mono-text">Self-Hosted · Local-First · Zero Cloud Lock-in · Enterprise Ready</text>
    </g>

  </g>
</svg>
